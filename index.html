<title>Tequeño House · Gestor</title>
<style>
:root{--bg:#FFF9F0;--surface:#fff;--surface-2:#FFF2DF;--surface-3:#FFE9C6;--text:#2B1D0E;--soft:#8B6F4E;--border:#F2D8B5;--accent:#FF8A1A;--accent-2:#FFB800;--accent-light:#FFF0D6;--danger:#DC2626;--danger-bg:#FEF2F2;--danger-bd:#FECACA;--shadow:0 12px 32px rgba(91,50,0,.08);--shadow-lg:0 20px 50px rgba(91,50,0,.14)}
@media(prefers-color-scheme:dark){:root{--bg:#1A1208;--surface:#261C0D;--surface-2:#332512;--surface-3:#3D2E18;--text:#FFF3E0;--soft:#C9A67D;--border:#4A3520;--accent:#FF9A2E;--accent-2:#FFC93C;--accent-light:#3A2A14;--danger:#F87171;--danger-bg:#3B1515;--danger-bd:#6B2121;--shadow:0 12px 32px rgba(0,0,0,.4);--shadow-lg:0 20px 50px rgba(0,0,0,.5)}}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%}
.display{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.02em}
button{cursor:pointer;border:0;background:none;color:inherit;font-weight:700;font-size:13px}
button:disabled{opacity:.6;cursor:default}
input,select{font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;height:44px;padding:0 12px;width:100%;font-weight:600}
input:focus,select:focus{outline:2px solid var(--accent)}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.bar{max-width:1200px;margin:auto;padding:0 16px;height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:900}
.logo b{font-size:17px;line-height:1}.logo small{display:block;font-size:10px;letter-spacing:.14em;color:var(--soft);font-weight:700;text-transform:uppercase}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px}
nav button{padding:8px 14px;border-radius:99px;color:var(--soft)}
nav button.on{background:var(--text);color:var(--bg)}
.hoy{font-size:11px;font-weight:800;padding:6px 10px;border-radius:99px;background:var(--accent);color:#fff;white-space:nowrap}
main{max-width:1200px;margin:auto;padding:20px 16px 90px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.main2{grid-template-columns:1.1fr .9fr}
@media(max-width:860px){.g4{grid-template-columns:1fr 1fr}.main2,.g2{grid-template-columns:1fr}nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:40;box-shadow:var(--shadow-lg)}.hoy{font-size:10px}.logo small{display:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:20px}
.card h2{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:800;margin-bottom:4px}
.sub{font-size:12px;color:var(--soft);margin-bottom:14px}
.kpi{padding:14px;border-radius:18px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
.kpi.warn{background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger)}
.kpi small{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.kpi b{display:block;font-family:Georgia,'Times New Roman',serif;font-size:21px;margin-top:4px}
.kpi span{font-size:11px;color:var(--soft);font-weight:600}
.btn{height:44px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.dark{background:var(--text);color:var(--bg)}
.ghost{background:var(--surface-2);border:1px solid var(--border)}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.box{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:14px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:8px}
.item.low{background:var(--danger-bg);border-color:var(--danger-bd)}
.item.void{opacity:.5}.item.void .t{text-decoration:line-through}
.item .t{font-weight:700;font-size:13px}.item .s{font-size:11px;color:var(--soft);font-weight:600}
.pill{font-size:10px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--text);color:var(--bg);white-space:nowrap}
.pill.r{background:var(--danger);color:#fff}
.round{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:16px;flex:none}
.big{font-family:Georgia,'Times New Roman',serif;font-size:68px;font-weight:800;line-height:1;text-align:center}
.pack{text-align:left;padding:14px;border-radius:16px;border:2px solid var(--border);background:var(--surface-2);width:100%}
.pack.on{border-color:var(--accent);background:var(--accent-light)}
.pack b{font-size:15px;display:block}.pack span{font-size:12px;color:var(--soft);font-weight:600}
.flbl{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}
.flbl small{display:block;font-size:11px;font-weight:500;color:var(--soft)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 10px}
.lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:12px 0 6px}
.total{background:var(--text);color:var(--bg);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.total b{font-family:Georgia,'Times New Roman',serif;font-size:28px}
.bar-r{height:26px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;position:relative;flex:1}
.bar-r i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .6s}
.bar-r span{position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:800}
.mname{width:92px;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metodos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.metodos button{height:42px;border-radius:12px;border:2px solid var(--border);background:var(--surface-2)}
.metodos button.on{border-color:var(--accent);background:var(--accent-light)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:60;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);background:var(--text);color:var(--bg);max-width:92vw;text-align:center}
#toast.err{background:var(--danger);color:#fff}
.empty{text-align:center;color:var(--soft);font-size:13px;padding:26px 8px}
.login{max-width:380px;margin:9vh auto 0}
.login .mark{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:26px;margin:0 auto 14px}
.lg-s{height:44px;width:auto;border-radius:10px;background:#fff;display:block}
.lg-b{width:min(240px,70%);height:auto;display:block;margin:0 auto 6px;border-radius:16px;background:#fff}
.err-t{color:var(--danger);font-size:12px;font-weight:700;margin-top:10px;min-height:16px}
</style>
</head>

const PACKS=[{id:'p8',label:'Pack 8',cant:8,precio:10},{id:'p15',label:'Pack 15',cant:15,precio:20},{id:'p25',label:'Pack 25',cant:25,precio:30},{id:'p35',label:'Pack 35',cant:35,precio:40}];
const METODOS=['Yape','Plin','Efectivo','Transferencia'];
const TABS=[['dashboard','Dashboard'],['stock','Stock'],['ventas','Ventas'],['historial','Historial']];

let USER=null,CARGANDO=true,unsubs=[];
let S={tequenos:0,bebidas:[],ventas:[]};
const U={tab:'ventas',pack:null,custom:false,cQty:'8',cPrice:'10',mult:1,beb:'',bQty:1,metodo:'Yape',cart:[],cliente:'',editBeb:null,bf:{nombre:'',precio:'',unidades:''},fecha:dayKey(Date.now()),verTodo:false,vend:'',addTq:'',busy:false,loginErr:'',ln:'',la:''};

function dayKey(ts){return new Date(ts).toLocaleDateString('en-CA')}
const money=n=>'S/ '+(+n||0).toFixed(2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
let tt;
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)}
const vigentes=()=>S.ventas.filter(v=>!v.anulada);
const delDia=k=>vigentes().filter(v=>dayKey(v.ts)===k);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const stockBebidas=()=>sum(S.bebidas,b=>b.unidades||0);
const cap=t=>t.trim().replace(/\s+/g,' ').split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
function cartTotals(){const tq=sum(U.cart.filter(i=>i.type==='tq'),i=>i.cant);return{total:sum(U.cart,i=>i.subtotal),tq,bb:sum(U.cart.filter(i=>i.type==='bb'),i=>i.cant)}}

/* ---------- vistas ---------- */
function vLogin(){return `<div class="card login">
  <img class="lg-b" src="${LOGO_BIG}" alt="Tequeño House">
  <h2 class="display" style="text-align:center;font-size:24px">¿Quién eres?</h2>
  <div class="sub" style="text-align:center">Escribe tu nombre y apellido para registrar ventas</div>
  <label class="flbl">Nombre</label><input id="lu" autocomplete="given-name" placeholder="Ej: Ana" value="${esc(U.ln)}">
  <label class="flbl">Apellido</label><input id="la" autocomplete="family-name" placeholder="Ej: Pérez" value="${esc(U.la)}">
  <button class="btn pri" style="width:100%;height:50px;margin-top:16px;font-size:15px" data-act="login" ${U.busy?'disabled':''}>${U.busy?'Entrando…':'Entrar'}</button>
  <div class="err-t">${esc(U.loginErr)}</div></div>`}

function vDashboard(){
  const vh=delDia(dayKey(Date.now())),vt=vigentes();
  const pm={};METODOS.forEach(m=>pm[m]=0);vh.forEach(v=>pm[v.metodo]=(pm[v.metodo]||0)+v.total);
  const pv={};vh.forEach(v=>pv[v.vendedor||'—']=(pv[v.vendedor||'—']||0)+v.total);
  const mx=Math.max(...Object.values(pm),1),mv=Math.max(...Object.values(pv),1);
  return `<div class="grid g4">
    <div class="kpi ${S.tequenos<20?'warn':''}"><small>Stock tequeños</small><b>${S.tequenos}</b><span>${S.tequenos<20?'¡Stock bajo!':'unidades'}</span></div>
    <div class="kpi"><small>Bebidas en stock</small><b>${stockBebidas()}</b><span>unidades</span></div>
    <div class="kpi"><small>Vendido hoy</small><b>${money(sum(vh,v=>v.total))}</b><span>${vh.length} ventas</span></div>
    <div class="kpi"><small>Vendido total</small><b>${money(sum(vt,v=>v.total))}</b><span>${vt.length} ventas</span></div>
  </div>
  <div class="grid main2" style="margin-top:16px">
    <div class="grid" style="align-content:start">
      <div class="card"><h2>Hoy por método de pago</h2><div class="sub">Solo ventas vigentes</div>
        ${METODOS.map(m=>`<div class="row" style="margin-bottom:10px"><div class="mname">${m}</div><div class="bar-r"><i style="width:${pm[m]/mx*100}%"></i><span>${money(pm[m])}</span></div></div>`).join('')}</div>
      <div class="card"><h2>Hoy por vendedor</h2><div class="sub">Quién registró cada venta</div>
        ${Object.keys(pv).length?Object.entries(pv).sort((a,b)=>b[1]-a[1]).map(([n,t])=>`<div class="row" style="margin-bottom:10px"><div class="mname">${esc(n)}</div><div class="bar-r"><i style="width:${t/mv*100}%"></i><span>${money(t)}</span></div></div>`).join(''):'<div class="empty">Aún no hay ventas hoy.</div>'}
        <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn dark" data-act="cierre">📋 Copiar cierre del día</button><button class="btn ghost" data-act="csv">⬇ Exportar CSV</button></div></div>
    </div>
    <div class="card"><h2>Ventas de hoy</h2><div class="sub">${new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'})}</div>
      ${vh.length?vh.map(v=>ventaRow(v)).join(''):'<div class="empty">Aún no hay ventas hoy.</div>'}</div>
  </div>`;
}

function ventaRow(v,conAnular){
  const h=new Date(v.ts).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  const det=v.items.map(i=>i.type==='tq'?`${i.cant} tequeños`:`${i.cant} ${esc(i.nombre)}`).join(' + ');
  return `<div class="item ${v.anulada?'void':''}"><div style="min-width:0"><div class="t">${det}</div>
    <div class="s">${h} · ${esc(v.vendedor||'—')}${v.cliente?' · '+esc(v.cliente):''} · ${v.metodo}${v.anulada?' · ANULADA'+(v.anuladaPor?' por '+esc(v.anuladaPor):''):''}</div></div>
    <div class="row"><b>${money(v.total)}</b>${conAnular&&!v.anulada?`<button class="round" data-act="anular" data-id="${v.id}" title="Anular">✕</button>`:''}</div></div>`;
}

function vStock(){
  const f=U.bf,ed=U.editBeb;
  return `<div class="grid g2">
  <div class="card"><h2>🥟 Stock de tequeños</h2><div class="sub">Suma lo que preparaste. Ej: horneaste 100 hoy, súmalos aquí.</div>
    <div class="box" style="${S.tequenos<20?'background:var(--danger-bg);border-color:var(--danger-bd)':''}"><div class="big">${S.tequenos}</div>
      <div class="sub" style="text-align:center;margin:4px 0 0">unidades listas${S.tequenos<20?' · <b style="color:var(--danger)">¡stock bajo!</b>':''}</div></div>
    <div class="row" style="margin-top:14px"><input id="addTq" inputmode="numeric" placeholder="Ej: 100" value="${esc(U.addTq)}"><button class="btn pri" data-act="addTq">+ Agregar</button></div>
    <div class="grid g3" style="gap:8px;margin-top:10px">${[50,100,200].map(n=>`<button class="btn ghost" data-act="quick" data-n="${n}">+${n}</button>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" style="flex:1" data-act="setTq">Corregir stock…</button></div></div>
  <div class="card"><h2>🥤 Bebidas</h2><div class="sub">Registra cada bebida una sola vez. Luego ajusta las unidades con los botones + y −.</div>
    <div class="box"><div class="lbl" style="margin-top:0">${ed?'Editando bebida':'Nueva bebida'}</div>
      <label class="flbl">Nombre de la bebida</label><input id="bnom" placeholder="Ej: Gaseosa 500ml" value="${esc(f.nombre)}">
      <div class="fgrid">
        <div><label class="flbl">Precio de venta (S/)<small>lo que cobras</small></label><input id="bpre" type="number" step="0.01" inputmode="decimal" placeholder="Ej: 3.48" value="${esc(f.precio)}"></div>
        <div><label class="flbl">Unidades<small>cuántas tienes</small></label><input id="buni" type="number" inputmode="numeric" placeholder="Ej: 10" value="${esc(f.unidades)}"></div>
      </div>
      <div class="row" style="margin-top:8px"><button class="btn ${ed?'dark':'pri'}" style="flex:1" data-act="saveBeb">${ed?'✓ Guardar cambios':'+ Agregar bebida'}</button>${ed?'<button class="btn ghost" data-act="cancelBeb">✕</button>':''}</div></div>
    <div style="margin-top:14px;max-height:380px;overflow:auto">
      ${S.bebidas.length?S.bebidas.map(b=>`<div class="item ${b.unidades<5?'low':''}">
        <div style="min-width:0"><div class="t">${esc(b.nombre)} ${b.unidades<5?'<span class="pill r">BAJO</span>':''}</div><div class="s">${money(b.precio)}</div></div>
        <div class="row"><button class="round" data-act="bst" data-id="${b.id}" data-d="-1">−</button><b style="min-width:22px;text-align:center">${b.unidades}</b><button class="round" data-act="bst" data-id="${b.id}" data-d="1">+</button>
        <button class="round" data-act="editBeb" data-id="${b.id}" title="Editar">✎</button><button class="round" data-act="delBeb" data-id="${b.id}" title="Eliminar">🗑</button></div></div>`).join(''):'<div class="empty">Sin bebidas. Agrega la primera.</div>'}
    </div></div></div>`;
}

function vVentas(){
  const ct=cartTotals(),pk=PACKS.find(p=>p.id===U.pack);
  let resumen='Elige un pack para ver el detalle';
  if(U.custom)resumen=`${(parseInt(U.cQty)||0)*U.mult} tequeños · ${money((parseFloat(U.cPrice)||0)*U.mult)}`;
  else if(pk)resumen=`${pk.cant*U.mult} tequeños · ${money(pk.precio*U.mult)}`;
  return `<div class="grid main2">
  <div class="grid" style="align-content:start">
    <div class="card"><div class="row sp"><h2>🥟 Tequeños</h2><label class="row" style="font-size:12px;font-weight:700;cursor:pointer"><input type="checkbox" data-act="custom" ${U.custom?'checked':''} style="width:18px;height:18px;accent-color:var(--accent)"> Personalizado</label></div>
      <div class="sub">Stock disponible: <b>${S.tequenos}</b></div>
      ${U.custom?`<div class="grid g2 box" style="gap:10px"><div><div class="lbl" style="margin-top:0">Cantidad</div><input id="cq" type="number" value="${esc(U.cQty)}"></div><div><div class="lbl" style="margin-top:0">Precio S/</div><input id="cp" type="number" step="0.01" value="${esc(U.cPrice)}"></div></div>`
      :`<div class="grid g2" style="gap:10px">${PACKS.map(p=>`<button class="pack ${U.pack===p.id?'on':''}" data-act="pack" data-id="${p.id}"><b>${p.label}${U.pack===p.id?' ✓':''}</b><span>${p.cant} unid. · S/ ${p.precio}</span><span style="display:block;font-size:11px">S/ ${(p.precio/p.cant).toFixed(2)} por tequeño</span></button>`).join('')}</div>`}
      <div class="row" style="margin-top:14px;flex-wrap:wrap">
        <button class="round" style="width:42px;height:42px;border-radius:12px" data-act="mult" data-d="-1">−</button>
        <div class="box" style="padding:0;width:52px;height:42px;display:grid;place-items:center;font-weight:800">${U.mult}</div>
        <button class="round" style="width:42px;height:42px;border-radius:12px" data-act="mult" data-d="1">+</button>
        <div style="flex:1;font-size:12px;font-weight:700;min-width:120px">${resumen}</div>
        <button class="btn dark" data-act="addPack">🛒 Agregar</button></div></div>
    <div class="card"><h2>🥤 Bebidas</h2>
      ${S.bebidas.length?`<div class="row" style="margin-top:8px"><select id="bsel">${S.bebidas.map(b=>`<option value="${b.id}" ${U.beb===b.id?'selected':''}>${esc(b.nombre)} — ${money(b.precio)} (${b.unidades})</option>`).join('')}</select>
        <button class="round" style="width:38px;height:44px;border-radius:12px" data-act="bq" data-d="-1">−</button><b style="min-width:20px;text-align:center">${U.bQty}</b><button class="round" style="width:38px;height:44px;border-radius:12px" data-act="bq" data-d="1">+</button>
        <button class="btn ghost" data-act="addBeb">Agregar</button></div>`:'<div class="empty">Sin bebidas · agrégalas en la pestaña Stock.</div>'}</div>
  </div>
  <div class="card" style="display:flex;flex-direction:column">
    <div class="row sp"><h2>Carrito</h2><span class="pill">${U.cart.length} ítems</span></div>
    <div style="flex:1;min-height:150px;margin-top:10px">
      ${U.cart.length?U.cart.map((i,ix)=>`<div class="item"><div style="min-width:0"><div class="t">${i.type==='tq'?i.cant+' tequeños':esc(i.nombre)}</div><div class="s">${i.type==='tq'?i.label:money(i.precio)+' c/u'}</div></div>
        <div class="row">${i.type==='bb'?`<button class="round" data-act="cq" data-i="${ix}" data-d="-1">−</button><b>${i.cant}</b><button class="round" data-act="cq" data-i="${ix}" data-d="1">+</button>`:''}<b style="min-width:62px;text-align:right">${money(i.subtotal)}</b><button class="round" data-act="rm" data-i="${ix}">✕</button></div></div>`).join('')
      :'<div class="empty">Carrito vacío.<br>Agrega packs y bebidas; se descuentan del stock al vender.</div>'}</div>
    <div class="lbl">Cliente / nota (opcional)</div><input id="cli" placeholder="Ej: Mesa 3, Ana, delivery…" value="${esc(U.cliente)}">
    <div class="lbl">Método de pago *</div><div class="metodos">${METODOS.map(m=>`<button class="${U.metodo===m?'on':''}" data-act="metodo" data-m="${m}">${m}</button>`).join('')}</div>
    <div class="total" style="margin-top:14px"><div><div style="font-size:10px;letter-spacing:.1em;font-weight:800;opacity:.7">TOTAL A COBRAR</div><b>${money(ct.total)}</b><div style="font-size:11px;opacity:.7">${ct.tq} tequeños + ${ct.bb} bebidas</div></div>
      <div style="text-align:right;font-size:12px"><div style="opacity:.7;font-size:10px;font-weight:800">STOCK TRAS VENTA</div><b style="font-size:16px;font-family:inherit">${Math.max(0,S.tequenos-ct.tq)}</b></div></div>
    <button class="btn pri" style="width:100%;height:54px;margin-top:12px;font-size:16px" data-act="vender" ${U.busy?'disabled':''}>✓ Registrar venta · ${money(ct.total)}</button>
    <div style="font-size:11px;color:var(--soft);text-align:center;margin-top:8px">Se registra a nombre de <b>${esc(USER.nombre)}</b></div>
  </div></div>`;
}

function vHistorial(){
  const vendedores=[...new Set(S.ventas.map(v=>v.vendedor).filter(Boolean))].sort();
  const lista=S.ventas.filter(v=>(U.verTodo||dayKey(v.ts)===U.fecha)&&(!U.vend||v.vendedor===U.vend));
  const vig=lista.filter(v=>!v.anulada);
  return `<div class="card"><h2>Historial de ventas</h2><div class="sub">Filtra por fecha o vendedor. Anular una venta devuelve el stock.</div>
    <div class="row" style="flex-wrap:wrap">
      <input type="date" id="fecha" value="${U.fecha}" style="width:160px" ${U.verTodo?'disabled':''}>
      <label class="row" style="font-size:12px;font-weight:700;cursor:pointer"><input type="checkbox" data-act="verTodo" ${U.verTodo?'checked':''} style="width:18px;height:18px;accent-color:var(--accent)"> Ver todo</label>
      <select id="fvend" style="width:150px"><option value="">Todos los vendedores</option>${vendedores.map(n=>`<option ${U.vend===n?'selected':''}>${esc(n)}</option>`).join('')}</select>
      <div style="flex:1"></div><span class="pill">${vig.length} ventas · ${money(sum(vig,v=>v.total))}</span></div>
    <div style="margin-top:14px">${lista.length?lista.map(v=>`<div style="font-size:10px;color:var(--soft);font-weight:700;margin:0 0 2px 2px">${U.verTodo?new Date(v.ts).toLocaleDateString('es-PE'):''}</div>`+ventaRow(v,true)).join(''):'<div class="empty">Sin ventas en este filtro.</div>'}</div></div>`;
}

/* ---------- render ---------- */
function render(){
  const ae=document.activeElement,aid=ae&&ae.id,pos=ae&&ae.selectionStart;
  $('#nav').style.display=USER?'flex':'none';
  $('#nav').innerHTML=USER?TABS.map(([id,l])=>`<button class="${U.tab===id?'on':''}" data-act="tab" data-id="${id}">${l}</button>`).join(''):'';
  $('#hdr').innerHTML=USER?`<div class="hoy">✨ ${money(sum(delDia(dayKey(Date.now())),v=>v.total))} hoy</div><button class="pill" data-act="salir">👤 ${esc(USER.nombre)} · Cambiar</button>`:'';
  $('#app').innerHTML=CARGANDO?'<div class="empty">Cargando…</div>':!USER?vLogin():{dashboard:vDashboard,stock:vStock,ventas:vVentas,historial:vHistorial}[U.tab]();
  if(aid){const el=document.getElementById(aid);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
}

/* ---------- sesión y datos en vivo ---------- */
const errDatos=e=>{console.error(e);toast('Sin permiso o sin conexión con Firebase: revisa las reglas de Firestore',1)};
function iniciar(){
  unsubs.push(onSnapshot(estadoRef,s=>{S.tequenos=s.exists()?(s.data().tequenos||0):0;render()},errDatos));
  unsubs.push(onSnapshot(collection(db,'bebidas'),s=>{S.bebidas=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));render()},errDatos));
  unsubs.push(onSnapshot(query(collection(db,'ventas'),orderBy('ts','desc')),s=>{S.ventas=s.docs.map(d=>({id:d.id,...d.data()}));render()},errDatos));
}
let AUTH=null;
function sync(){
  unsubs.forEach(f=>f());unsubs=[];S={tequenos:0,bebidas:[],ventas:[]};U.cart=[];
  USER=(AUTH&&NOMBRE)?{uid:AUTH.uid,nombre:NOMBRE}:null;
  CARGANDO=false;if(USER)iniciar();render();
}
onAuthStateChanged(auth,u=>{AUTH=u;sync()});

/* ---------- acciones ---------- */
const run=fn=>async(...a)=>{try{await fn(...a)}catch(e){console.error(e);toast('No se pudo guardar. Revisa tu conexión.',1)}};
const A={
  login:run(async()=>{const n=cap($('#lu').value),ap=cap($('#la').value);U.ln=n;U.la=ap;
    if(n.length<2||ap.length<2){U.loginErr='Escribe tu nombre y tu apellido';return render()}
    U.busy=true;U.loginErr='';render();
    try{NOMBRE=n+' '+ap;if(!auth.currentUser)await signInAnonymously(auth);AUTH=auth.currentUser;U.ln=U.la='';sync()}
    catch(e){U.loginErr=e.code==='auth/operation-not-allowed'?'Falta activar el acceso anónimo en Firebase':e.code==='auth/network-request-failed'?'Sin conexión a internet':'No se pudo entrar ('+(e.code||e.message)+')'}
    U.busy=false;render()}),
  salir(){if(!confirm('¿Cambiar de usuario?'))return;NOMBRE='';sync()},
  tab(e){U.tab=e.id;render()},
  addTq:run(async()=>{const n=parseInt(U.addTq);if(!n||n<=0)return toast('Ingresa una cantidad válida',1);U.addTq='';await setDoc(estadoRef,{tequenos:increment(n)},{merge:true});toast(`+${n} tequeños al stock`)}),
  quick:run(async e=>{const n=+e.n;await setDoc(estadoRef,{tequenos:increment(n)},{merge:true});toast(`+${n} tequeños`)}),
  setTq:run(async()=>{const v=prompt('Stock real de tequeños:',S.tequenos);if(v===null)return;const n=parseInt(v);if(isNaN(n)||n<0)return toast('Número inválido',1);await setDoc(estadoRef,{tequenos:n},{merge:true});toast('Stock corregido')}),
  saveBeb:run(async()=>{const f=U.bf,p=parseFloat(f.precio),u=parseInt(f.unidades);
    if(!f.nombre.trim()||isNaN(p)||p<=0||isNaN(u)||u<0)return toast('Completa nombre, precio y unidades',1);
    const data={nombre:f.nombre.trim(),precio:p,unidades:u};
    if(U.editBeb){await updateDoc(doc(db,'bebidas',U.editBeb),data);U.editBeb=null;toast('Bebida actualizada')}else{await addDoc(collection(db,'bebidas'),data);toast('Bebida agregada')}
    U.bf={nombre:'',precio:'',unidades:''};render()}),
  cancelBeb(){U.editBeb=null;U.bf={nombre:'',precio:'',unidades:''};render()},
  editBeb(e){const b=S.bebidas.find(x=>x.id===e.id);U.editBeb=b.id;U.bf={nombre:b.nombre,precio:String(b.precio),unidades:String(b.unidades)};render()},
  delBeb:run(async e=>{const b=S.bebidas.find(x=>x.id===e.id);if(!confirm(`¿Eliminar ${b.nombre}?`))return;U.cart=U.cart.filter(i=>i.id!==b.id);await deleteDoc(doc(db,'bebidas',b.id))}),
  bst:run(async e=>{await updateDoc(doc(db,'bebidas',e.id),{unidades:increment(+e.d)})}),
  pack(e){U.pack=e.id;render()},
  custom(e,el){U.custom=el.checked;render()},
  mult(e){U.mult=Math.max(1,U.mult+ +e.d);render()},
  addPack(){let cant,precio,label;
    if(U.custom){const q=parseInt(U.cQty),p=parseFloat(U.cPrice);if(!q||q<=0||isNaN(p)||p<=0)return toast('Revisa cantidad y precio',1);cant=q*U.mult;precio=p*U.mult;label='Personalizado'}
    else{const pk=PACKS.find(p=>p.id===U.pack);if(!pk)return toast('Elige un pack primero',1);cant=pk.cant*U.mult;precio=pk.precio*U.mult;label=pk.label+(U.mult>1?' ×'+U.mult:'')}
    const ya=sum(U.cart.filter(i=>i.type==='tq'),i=>i.cant);
    if(ya+cant>S.tequenos)return toast(`Stock insuficiente: tienes ${S.tequenos}, pedido ${ya+cant}`,1);
    U.cart.push({type:'tq',cant,subtotal:precio,label});U.mult=1;render();toast(`${cant} tequeños agregados`)},
  bq(e){U.bQty=Math.max(1,U.bQty+ +e.d);render()},
  addBeb(){const b=S.bebidas.find(x=>x.id===(U.beb||S.bebidas[0]?.id));if(!b)return toast('Elige una bebida',1);
    const ex=U.cart.find(i=>i.type==='bb'&&i.id===b.id),nueva=(ex?ex.cant:0)+U.bQty;
    if(nueva>b.unidades)return toast(`Solo hay ${b.unidades} de ${b.nombre}`,1);
    if(ex){ex.cant=nueva;ex.subtotal=nueva*b.precio}else U.cart.push({type:'bb',id:b.id,nombre:b.nombre,precio:b.precio,cant:U.bQty,subtotal:b.precio*U.bQty});
    const q=U.bQty;U.bQty=1;render();toast(`${q} × ${b.nombre} al carrito`)},
  cq(e){const i=U.cart[+e.i],b=S.bebidas.find(x=>x.id===i.id),n=i.cant+ +e.d;if(n<1)U.cart.splice(+e.i,1);else if(b&&n>b.unidades)return toast(`Solo hay ${b.unidades}`,1);else{i.cant=n;i.subtotal=n*i.precio}render()},
  rm(e){U.cart.splice(+e.i,1);render()},
  metodo(e){U.metodo=e.m;render()},
  vender:run(async()=>{if(U.busy)return;if(!U.cart.length)return toast('Carrito vacío',1);
    const ct=cartTotals();if(ct.tq>S.tequenos)return toast(`Faltan tequeños: stock ${S.tequenos}, pedido ${ct.tq}`,1);
    for(const i of U.cart)if(i.type==='bb'){const b=S.bebidas.find(x=>x.id===i.id);if(!b||i.cant>b.unidades)return toast(`Stock insuficiente de ${i.nombre}`,1)}
    U.busy=true;render();
    try{const batch=writeBatch(db),vref=doc(collection(db,'ventas'));
      batch.set(vref,{ts:Date.now(),items:U.cart,total:ct.total,metodo:U.metodo,cliente:U.cliente.trim(),tq:ct.tq,anulada:false,vendedor:USER.nombre,uid:USER.uid});
      if(ct.tq)batch.set(estadoRef,{tequenos:increment(-ct.tq)},{merge:true});
      U.cart.filter(i=>i.type==='bb').forEach(i=>batch.update(doc(db,'bebidas',i.id),{unidades:increment(-i.cant)}));
      await batch.commit();const tot=ct.total,met=U.metodo;U.cart=[];U.cliente='';toast(`Venta registrada: ${money(tot)} por ${met}`)}
    finally{U.busy=false;render()}}),
  anular:run(async e=>{const v=S.ventas.find(x=>x.id===e.id);if(!v||v.anulada||!confirm(`¿Anular la venta de ${money(v.total)} hecha por ${v.vendedor||'—'}? Se devolverá el stock.`))return;
    const batch=writeBatch(db);batch.update(doc(db,'ventas',v.id),{anulada:true,anuladaPor:USER.nombre});
    if(v.tq)batch.set(estadoRef,{tequenos:increment(v.tq)},{merge:true});
    v.items.filter(i=>i.type==='bb'&&S.bebidas.some(b=>b.id===i.id)).forEach(i=>batch.update(doc(db,'bebidas',i.id),{unidades:increment(i.cant)}));
    await batch.commit();toast('Venta anulada y stock devuelto')}),
  verTodo(e,el){U.verTodo=el.checked;render()},
  cierre(){const vh=delDia(dayKey(Date.now()));if(!vh.length)return toast('No hay ventas hoy',1);
    const pm={},pv={},bb={};vh.forEach(v=>{pm[v.metodo]=(pm[v.metodo]||0)+v.total;pv[v.vendedor||'—']=(pv[v.vendedor||'—']||0)+v.total;v.items.filter(i=>i.type==='bb').forEach(i=>bb[i.nombre]=(bb[i.nombre]||0)+i.cant)});
    const txt=`🥟 CIERRE ${new Date().toLocaleDateString('es-PE')}\nVentas: ${vh.length}\nTotal: ${money(sum(vh,v=>v.total))}\nTequeños vendidos: ${sum(vh,v=>v.tq||0)}\n`+(Object.keys(bb).length?'Bebidas: '+Object.entries(bb).map(([n,c])=>`${c} ${n}`).join(', ')+'\n':'')+'\nPor método:\n'+Object.entries(pm).map(([m,t])=>`• ${m}: ${money(t)}`).join('\n')+'\n\nPor vendedor:\n'+Object.entries(pv).map(([m,t])=>`• ${m}: ${money(t)}`).join('\n')+`\n\nStock: ${S.tequenos} tequeños`;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Cierre copiado')).catch(()=>prompt('Copia el cierre:',txt))},
  csv(){const rows=S.ventas.map(v=>{const d=new Date(v.ts);return [d.toLocaleDateString('es-PE'),d.toLocaleTimeString('es-PE'),`"${v.items.map(i=>i.type==='tq'?i.cant+' tequeños':i.cant+' '+i.nombre).join(' + ')}"`,`"${(v.vendedor||'').replace(/"/g,'""')}"`,`"${(v.cliente||'').replace(/"/g,'""')}"`,v.total.toFixed(2),v.metodo,v.tq||0,v.anulada?'ANULADA':'OK'].join(',')});
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿Fecha,Hora,Detalle,Vendedor,Cliente,Total,Metodo,Tequeños,Estado\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='ventas-tequenos-'+dayKey(Date.now())+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
};

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;const f=A[el.dataset.act];if(f)f(el.dataset,el)});
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.type==='checkbox'){const f=A[el.dataset.act];if(f)f(el.dataset,el)}
  if(el.id==='fecha'){U.fecha=el.value||dayKey(Date.now());render()}
  if(el.id==='fvend'){U.vend=el.value;render()}
  if(el.id==='bsel')U.beb=el.value});
document.addEventListener('input',ev=>{const el=ev.target,m={addTq:v=>U.addTq=v.replace(/\D/g,''),cq:v=>U.cQty=v,cp:v=>U.cPrice=v,cli:v=>U.cliente=v,bnom:v=>U.bf.nombre=v,bpre:v=>U.bf.precio=v,buni:v=>U.bf.unidades=v};
  if(m[el.id])m[el.id](el.value);if(el.id==='addTq')el.value=U.addTq});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;if(ev.target.id==='addTq')A.addTq();if(ev.target.id==='la')A.login();if(ev.target.id==='lu')$('#la').focus()});
render();
</script>
</body>
</html>
